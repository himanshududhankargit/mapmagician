<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Demo — Alur Regional Plan | Map Magician</title>
    <meta name="description" content="Explore a real development plan sheet free — Alur, Tal. Umarga, Dist. Osmanabad. Zoom to survey-number detail, no sign-up required.">
    <!-- Demo is a sample of paid content: keep it out of the index so it never
         outranks the region pages that actually sell. -->
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="AssetsGIS/mapmagiciansmall.png">
    <link rel="apple-touch-icon" href="AssetsGIS/mapmagiciansmall.png">
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://tiles.mapmagician.in" crossorigin>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #eceff1; }
        #map { position: absolute; inset: 0; }

        /* ---- top bar ---- */
        #demo-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 5;
            display: flex; align-items: center; gap: 14px; padding: 10px 16px;
            background: linear-gradient(135deg, #00796B, #004D40); color: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.25); }
        #demo-bar .db-pill { display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 13px; border-radius: 20px; background: #fff; color: #00695C;
            font-size: 11px; font-weight: 800; letter-spacing: .4px; flex: none; }
        #demo-bar .db-text { min-width: 0; flex: 1; }
        #demo-bar .db-title { font-size: 15px; font-weight: 700; line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #demo-bar .db-sub { font-size: 12px; color: rgba(255,255,255,.78); margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #demo-cta { flex: none; padding: 10px 18px; border: none; border-radius: 8px;
            background: #4CAF50; color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; white-space: nowrap; transition: background .15s, transform .1s; }
        #demo-cta:hover { background: #429646; }
        #demo-cta:active { transform: scale(.97); }

        /* ---- hint + toast ---- */
        #demo-hint { position: absolute; left: 50%; transform: translateX(-50%);
            bottom: 26px; z-index: 5; padding: 9px 18px; border-radius: 20px;
            background: rgba(0,0,0,.72); color: #fff; font-size: 13px; font-weight: 500;
            pointer-events: none; opacity: 0; transition: opacity .3s; }
        #demo-hint.show { opacity: 1; }
        #demo-toast { position: absolute; left: 50%; transform: translateX(-50%) translateY(-8px);
            top: 78px; z-index: 6; padding: 11px 20px; border-radius: 8px;
            background: rgba(183,28,28,.94); color: #fff; font-size: 14px; font-weight: 600;
            pointer-events: none; opacity: 0; transition: opacity .22s, transform .22s;
            box-shadow: 0 4px 16px rgba(0,0,0,.3); }
        #demo-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---- loading ---- */
        #demo-load { position: absolute; inset: 0; z-index: 8; display: flex;
            align-items: center; justify-content: center; flex-direction: column; gap: 14px;
            background: #eceff1; transition: opacity .4s; }
        #demo-load.hide { opacity: 0; pointer-events: none; }
        #demo-load .dl-spin { width: 38px; height: 38px; border: 3px solid #B2DFDB;
            border-top-color: #00796B; border-radius: 50%; animation: dlspin .8s linear infinite; }
        @keyframes dlspin { to { transform: rotate(360deg); } }
        #demo-load .dl-text { font-size: 14px; color: #546E7A; font-weight: 600; }

        @media (max-width: 560px) {
            #demo-bar { gap: 10px; padding: 8px 12px; }
            #demo-bar .db-pill { font-size: 10px; padding: 5px 10px; }
            #demo-bar .db-pill .db-pill-long { display: none; }
            #demo-bar .db-title { font-size: 13px; }
            #demo-bar .db-sub { display: none; }
            #demo-cta { padding: 9px 13px; font-size: 13px; }
            #demo-toast { top: 66px; font-size: 13px; padding: 10px 16px; max-width: 90vw; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="demo-bar">
        <span class="db-pill">&#9654; DEMO<span class="db-pill-long"> MODE</span></span>
        <div class="db-text">
            <div class="db-title">Alur Regional Plan &mdash; free sample</div>
            <div class="db-sub">Tal. Umarga, Dist. Osmanabad &middot; zoom in for survey numbers</div>
        </div>
        <button id="demo-cta" type="button">Unlock Full Access &rarr;</button>
    </div>

    <div id="demo-hint">Pinch or scroll to zoom in &mdash; detail sharpens to plot level</div>
    <div id="demo-toast">Demo is restricted to this region only</div>

    <div id="demo-load">
        <div class="dl-spin"></div>
        <div class="dl-text">Loading demo plan&hellip;</div>
    </div>

    <script src="demo-app.js?v=139" defer></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBBfEcHoR1yHBlnOvWKYLkr3C3ob6nb5hw&callback=initDemo&loading=async" defer></script>
</body>
</html>
