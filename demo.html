<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Demo — Map Magician</title>
    <!-- Demo shows a sample of paid content: keep it out of the index so it never
         outranks the region pages that actually sell. -->
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="AssetsGIS/mapmagiciansmall.png">
    <link rel="canonical" href="https://www.mapmagician.in/maps.html">
    <!--
        This page is a REDIRECT, not an app.

        Demo mode used to be a standalone page with its own map. It is now a flag
        inside the real app (maps-app.js, `isDemoMode`) because the requirement is
        "the actual site with only one region to explore" — same interface, same
        opacity slider, legends, search and annotations, minus Download. A second
        implementation could only ever be a worse copy of the first, and would
        drift from it.

        demo.html survives purely as a short, shareable URL for the CTA and for
        marketing links. The "DEMO MODE" pill inside the unlock modal does NOT
        come here: it opens location.pathname + '?demo=1', so it stays on
        whichever build the visitor is already on (maps.html or maps1.html).

        Staging equivalent: maps1.html?demo=1
    -->
    <meta http-equiv="refresh" content="0; url=maps.html?demo=1">
    <script>location.replace('maps.html?demo=1');</script>
    <style>
        body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
            font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:#eceff1; color:#546E7A; }
        a { color:#00796B; font-weight:600; }
    </style>
</head>
<body>
    <p>Opening the demo&hellip; <a href="maps.html?demo=1">Continue</a></p>
</body>
</html>
