name: Republish districts

# Fires when the Android admin app pushes d1.bin / d3.bin updates. Regenerates
# tileFolderMap.json in the GIS web repo and syncs the folder->districtId pairs into the
# CloudFront KeyValueStore (mmp-tile-folders). That KVS sync is the step that makes a new
# district reachable past zoom 14 — it is the whole point of this workflow.
# The CloudFront gate CODE is constant (reads the KVS) so it is only redeployed on the rare
# run where cloudfront-gate.js itself changes.
#
# 🛑 This workflow does NOT deploy Firebase Functions, deliberately. It used to run
#    `firebase deploy --only functions:getCloudFrontCookies` from the gis-web checkout, which
#    was wrong twice over:
#      1. It failed outright — functions/index.js (and subPeriod/subGrace/tileGateSync/
#         moneyAtRisk) are intentionally NOT committed to gis-web; the working tree is the
#         source of truth for the backend.
#      2. Had it worked, it would have deployed the STALE committed backend over the live one.
#         That is the 2026-07-28 incident: getCloudFrontCookies silently reverted to a
#         Phase-A-era build (no `m` claim, no `s:1`), breaking mobile entitlement.
#    Instead, when the generator assigns NEW productIds the run now flags it in the success
#    email so a human redeploys from the working tree. Nothing is silently skipped, and this
#    is rarely needed anyway — getCloudFrontCookies merges the tileGate/productIds RTDB
#    overlay at runtime, so a brand-new id already works before any redeploy.
#
# Required repo secrets (configure in Settings → Secrets and variables → Actions):
#   GIS_WEB_PAT        fine-grained PAT with contents:write on the GIS web repo
#   AWS_ACCESS_KEY_ID  IAM user with cloudfront:DescribeFunction/UpdateFunction/PublishFunction
#                      AND cloudfront-keyvaluestore:DescribeKeyValueStore/UpdateKeys/ListKeys
#                      on the mmp-tile-folders KVS (see functions/scripts/publish-kvs.js)
#   AWS_SECRET_ACCESS_KEY
#   NOTIFY_GMAIL_USER  Gmail address for sending notifications (same one can live in Firebase as SUPPORT_GMAIL_USER)
#   NOTIFY_GMAIL_PASS  Gmail 16-char app password (NOT the account password)
#
# Required repo variable (Settings → Variables → Actions):
#   GIS_WEB_REPO       "<owner>/<gis-web-repo>" — the repo that holds functions/

on:
  push:
    branches: [main]
    paths:
      - 'data/database/d1.bin'
      - 'data/database/d3.bin'
  workflow_dispatch:

concurrency:
  group: republish-districts
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      # gis-web and mapmagician-main must sit as siblings inside the same parent,
      # because generateTileFolderMap.js:21 resolves d1.bin/d3.bin via
      # path.resolve(__dirname, "..", "mapmagician-main", ...). Mirror the local
      # C:/MyData/GIS web/ layout by nesting mapmagician-main inside the gis-web
      # checkout so ../mapmagician-main resolves correctly from functions/.
      - name: Checkout GIS web
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GIS_WEB_REPO }}
          token: ${{ secrets.GIS_WEB_PAT }}
          path: gis-web

      - name: Checkout mapmagician-main (inside gis-web)
        uses: actions/checkout@v4
        with:
          path: gis-web/mapmagician-main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: gis-web/functions/package-lock.json

      - name: Install functions deps
        working-directory: gis-web/functions
        run: npm ci

      - name: Regenerate tileFolderMap + patch cloudfront-gate
        id: regen
        working-directory: gis-web/functions
        # Generator reads ../mapmagician-main/data/database/{d1,d3}.bin;
        # our layout above puts both checkouts as siblings so the relative
        # path the generator expects resolves correctly.
        # Capture stdout so the notification email can include the summary.
        run: |
          node generateTileFolderMap.js | tee regen.log
          {
            echo "summary<<__EOF__"
            cat regen.log
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          # "  productIds:   45 (+2 new)" -> 2. Only a NEW id needs a backend redeploy;
          # a changed folder list is pure KVS and is handled by the sync step below.
          new_pids=$(sed -n 's/.*productIds:.*(+\([0-9][0-9]*\) new).*/\1/p' regen.log | head -1)
          echo "new_pids=${new_pids:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit regenerated files back to GIS web
        id: commit
        working-directory: gis-web
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "gate_changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — tileFolderMap already up-to-date"
            exit 0
          fi
          git config user.name  mmp-bot
          git config user.email mmp-bot@users.noreply.github.com
          git add functions/tileFolderMap.json functions/cloudfront-gate.js
          # The gate code is constant under KVS; only redeploy it if it actually changed.
          if git diff --cached --name-only | grep -qx 'functions/cloudfront-gate.js'; then
            echo "gate_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_changed=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "chore: republish districts [skip ci]

          Triggered by mapmagician-main@${{ github.sha }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Sync folder->districtId pairs into the CloudFront KeyValueStore on every change.
      # This is what makes a newly added/renamed district reachable past zoom 14: the gate
      # reads the KVS, so the district 403s above zoom 14 until this step runs. Upsert-only
      # (publish-kvs.js never deletes), so it can never remove access from an existing folder.
      - name: Sync KVS keys (folder -> district id)
        if: steps.commit.outputs.changed == 'true'
        working-directory: gis-web/functions
        run: node scripts/publish-kvs.js

      # Gate CODE rarely changes (it reads the KVS); only redeploy it when it actually did.
      - name: Deploy gate code (only when cloudfront-gate.js changed)
        if: steps.commit.outputs.gate_changed == 'true'
        working-directory: gis-web/functions
        run: bash scripts/publish-cloudfront.sh

      # See the 🛑 note at the top of this file: CI must never deploy the backend, because
      # gis-web does not carry functions/index.js and a checkout-based deploy would overwrite
      # the live function with a stale build. We only report that a redeploy is warranted.
      - name: Flag new productIds (backend redeploy needed)
        if: steps.regen.outputs.new_pids != '0'
        run: |
          echo "::warning title=New productIds — redeploy getCloudFrontCookies::${{ steps.regen.outputs.new_pids }} new productId(s) were assigned. Run 'firebase deploy --only functions:getCloudFrontCookies' from your WORKING TREE (never a clean checkout) to pin them into the deployed code. Access already works via the tileGate/productIds runtime overlay."

      - name: Notify — success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_PASS }}
          from: Map Magician CI <${{ secrets.NOTIFY_GMAIL_USER }}>
          to: himanshududhankar@gmail.com
          subject: "[mmp]${{ steps.regen.outputs.new_pids != '0' && ' ACTION NEEDED —' || '' }} Districts republished — ${{ github.event.head_commit.message && github.event.head_commit.id || github.sha }}"
          body: |
            Republish succeeded.
            ${{ steps.regen.outputs.new_pids != '0' && format('
            ⚠ ACTION NEEDED: {0} new productId(s) were assigned this run.
            Redeploy the backend so the ids are pinned into the deployed code:

                cd "C:/MyData/GIS web"
                firebase deploy --only functions:getCloudFrontCookies

            Deploy from your WORKING TREE, never a clean checkout — the committed copy is
            stale and would revert the live function (2026-07-28 incident).
            Not urgent: getCloudFrontCookies merges the tileGate/productIds RTDB overlay at
            runtime, so the new districts already grant correctly.
            ', steps.regen.outputs.new_pids) || '' }}
            Trigger: ${{ github.event_name }} on ${{ github.ref_name }}
            Commit (mapmagician-main): ${{ github.sha }}
            Gis-web files changed: ${{ steps.commit.outputs.changed }}
            New productIds: ${{ steps.regen.outputs.new_pids }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Generator summary:
            ${{ steps.regen.outputs.summary }}

      - name: Notify — failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_GMAIL_USER }}
          password: ${{ secrets.NOTIFY_GMAIL_PASS }}
          from: Map Magician CI <${{ secrets.NOTIFY_GMAIL_USER }}>
          to: himanshududhankar@gmail.com
          subject: "[mmp] Districts republish FAILED — ${{ github.sha }}"
          body: |
            Republish FAILED.

            Trigger: ${{ github.event_name }} on ${{ github.ref_name }}
            Commit (mapmagician-main): ${{ github.sha }}
            Run (has full log): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Generator summary (if it ran):
            ${{ steps.regen.outputs.summary }}
